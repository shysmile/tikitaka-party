<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1226">
<title>티키타카 파티</title>
<!-- 티키타카 파티 — 회의실 무통신 협동 미니게임. 휴대폰용 한 장 파일(tikitaka_party.html)은 _build.cjs 가 이 파일과 JS · CSS 를 하나로 묶어 만든다 -->
<style>
/* 티키타카 파티 — 휴대폰 먼저(팀원), 진행자는 TV 에서 크게 */
:root { --tp-bg: #0f1226; --tp-panel: #1a1f3d; --tp-line: rgba(255, 255, 255, 0.1); --tp-text: #f1f3ff; --tp-muted: #a3abd6; --tp-pri: #5b7cfa; --tp-pri2: #8b5cf6; --tp-good: #22c55e; --tp-warn: #f59e0b; --tp-bad: #ef4444; --tp-r: 16px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--tp-bg); color: var(--tp-text); font-family: 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
button, input, textarea { font: inherit; color: inherit; }
.tp { min-height: 100%; display: flex; flex-direction: column; background: radial-gradient(1200px 600px at 10% -10%, #2a2f6b 0%, transparent 60%), radial-gradient(900px 500px at 110% 10%, #3b1d5e 0%, transparent 55%), var(--tp-bg); }
.tp-ic { width: 1.15em; height: 1.15em; flex: none; }
.tp-grow { flex: 1; }
.tp-muted { color: var(--tp-muted); }
.tp-small { font-size: 12px; }
.center { text-align: center; justify-content: center; }
/* 위 막대 */
.tp-top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: rgba(15, 18, 38, 0.85); backdrop-filter: blur(8px); border-bottom: 1px solid var(--tp-line); }
.tp-brand { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; white-space: nowrap; }
.tp-brand .tp-ic { color: #ffd43b; }
.tp-roomchip { display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 10px; border: 1px solid var(--tp-line); border-radius: 17px; background: rgba(255, 255, 255, 0.06); cursor: pointer; font-size: 13px; white-space: nowrap; }
.tp-roomchip .k { color: var(--tp-muted); font-size: 11px; }
.tp-roomchip b { letter-spacing: 1px; }
.tp-check { margin-left: 4px; padding: 1px 7px; border-radius: 10px; background: rgba(91, 124, 250, 0.25); color: #c7d2fe; font-size: 11px; font-weight: 700; }
.tp-iconbtn { width: 34px; height: 34px; border: 0; border-radius: 10px; background: rgba(255, 255, 255, 0.06); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--tp-muted); }
.tp-iconbtn.on { color: #ffd43b; }
.tp-mode { display: inline-flex; padding: 3px; border-radius: 12px; background: rgba(255, 255, 255, 0.08); }
.tp-mode button { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 10px; border: 0; border-radius: 9px; background: none; color: var(--tp-muted); cursor: pointer; font-size: 13px; font-weight: 600; }
.tp-mode button.on { background: linear-gradient(135deg, var(--tp-pri), var(--tp-pri2)); color: #fff; }
/* 게임 탭 — 휴대폰은 아래 고정, 진행자는 위 */
.tp-tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(6, 1fr); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); background: rgba(15, 18, 38, 0.92); backdrop-filter: blur(8px); border-top: 1px solid var(--tp-line); }
.tp-tabs button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border: 0; border-radius: 12px; background: none; color: var(--tp-muted); cursor: pointer; font-size: 11px; }
.tp-tabs button .tp-ic { width: 22px; height: 22px; }
.tp-tabs button.on { color: #fff; background: rgba(91, 124, 250, 0.22); }
.tp-tn { position: absolute; top: 3px; right: 6px; font-size: 9px; opacity: 0.6; }
.tp-main { flex: 1; padding: 14px 14px 96px; }
.tp.host .tp-tabs { position: sticky; top: 55px; bottom: auto; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; padding: 8px 14px; border-top: 0; border-bottom: 1px solid var(--tp-line); }
.tp.host .tp-tabs button { flex-direction: row; justify-content: center; gap: 8px; padding: 10px; font-size: 16px; font-weight: 600; }
.tp.host .tp-tn { position: static; font-size: 12px; padding: 1px 7px; border-radius: 10px; background: rgba(255, 255, 255, 0.1); opacity: 1; }
.tp.host .tp-main { padding: 18px 24px 30px; }
/* 탭 · 단추 글자는 줄을 바꾸지 않는다 (11-23 사용자 '모바일에서 진행자로 열면 6 점 / 심 처럼 다음 줄로') */
.tp-tabs .tp-tl, .tp-btn, .tp-mode button { white-space: nowrap; }
.tp-tabs .tp-tl { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
/* 휴대폰 폭에서 진행자로 열면 — 탭은 팀원 화면처럼 아이콘 위 · 글자 아래(위 고정은 그대로) */
@media (max-width: 760px) {
  .tp.host .tp-tabs { gap: 4px; padding: 6px 8px; }
  .tp.host .tp-tabs button { flex-direction: column; gap: 2px; padding: 6px 2px; font-size: 11px; font-weight: 600; min-width: 0; }
  .tp.host .tp-tn { position: absolute; top: 3px; right: 6px; font-size: 9px; padding: 0; background: none; opacity: 0.6; }
  .tp.host .tp-main { padding: 14px 14px 30px; }
}
/* 단추 */
.tp-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 42px; padding: 0 16px; border: 1px solid var(--tp-line); border-radius: 12px; background: rgba(255, 255, 255, 0.08); color: var(--tp-text); cursor: pointer; font-weight: 600; text-decoration: none; user-select: none; }
.tp-btn:active { transform: scale(0.97); }
.tp-btn.primary { border: 0; background: linear-gradient(135deg, var(--tp-pri), var(--tp-pri2)); box-shadow: 0 6px 18px rgba(91, 124, 250, 0.35); }
.tp-btn.good { border: 0; background: linear-gradient(135deg, #16a34a, #22c55e); }
.tp-btn.danger { border: 0; background: linear-gradient(135deg, #dc2626, #f97316); }
.tp-btn.ghost { background: none; }
.tp-btn.sm { height: 32px; padding: 0 10px; font-size: 13px; border-radius: 10px; }
.tp-btn.lg { height: 52px; padding: 0 20px; font-size: 17px; }
.tp-btn.xl { height: 68px; padding: 0 30px; font-size: 22px; border-radius: 18px; }
.tp-btn.wide { width: 100%; }
.tp-btn.on { outline: 2px solid #ffd43b; }
.tp-btn:disabled { opacity: 0.45; cursor: default; }
.tp-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 12px 0; }
.tp-tip { display: flex; align-items: center; gap: 6px; color: var(--tp-muted); font-size: 13px; }
/* 게임 머리 */
.tp-ghead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
.tp-ghead h2 { display: inline-flex; align-items: center; gap: 8px; margin: 0; font-size: 20px; }
.tp.host .tp-ghead h2 { font-size: 28px; }
.tp-gtag { padding: 2px 9px; border-radius: 10px; background: rgba(255, 255, 255, 0.08); color: var(--tp-muted); font-size: 12px; }
.tp-how { margin: 0 0 12px; padding: 10px 14px; border-radius: 12px; background: rgba(255, 255, 255, 0.06); font-size: 14px; line-height: 1.55; }
.tp-how p { margin: 4px 0; }
.tp-how[hidden] { display: none; }
/* 방 코드 */
.tp-setup { max-width: 520px; margin: 20px auto; padding: 20px; border-radius: 20px; background: var(--tp-panel); border: 1px solid var(--tp-line); }
.tp.host .tp-setup { max-width: 760px; }
.tp-setup h2 { margin: 0 0 6px; }
.tp-bigcode { margin: 16px 0; text-align: center; font-size: 84px; font-weight: 900; letter-spacing: 16px; background: linear-gradient(135deg, #ffd43b, #ff6b6b); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tp-field { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; font-size: 13px; color: var(--tp-muted); }
.tp-field input { height: 52px; padding: 0 14px; border: 1px solid var(--tp-line); border-radius: 12px; background: rgba(0, 0, 0, 0.25); color: #fff; font-size: 24px; font-weight: 800; letter-spacing: 6px; text-transform: uppercase; }
.tp-field input#tpMobileUrl { font-size: 14px; letter-spacing: 0; text-transform: none; font-weight: 400; height: 42px; }
.tp-stepper { display: inline-flex; align-items: center; gap: 14px; }
.tp-stepper b { min-width: 40px; text-align: center; font-size: 28px; color: #fff; }
.tp-mobile { margin-top: 18px; padding: 16px; border-radius: 14px; background: rgba(0, 0, 0, 0.2); }
/* 6번 점심 · 커피 (11-24) */
.tp-lc-tabs { display: flex; justify-content: center; gap: 6px; margin: 0 auto 14px; padding: 4px; width: fit-content; border-radius: 14px; background: rgba(255, 255, 255, 0.06); }
.tp-lc-tabs button { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border: 0; border-radius: 11px; background: none; color: var(--tp-muted); font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.tp-lc-tabs button .tp-ic { width: 18px; height: 18px; }
.tp-lc-tabs button.on { background: linear-gradient(135deg, var(--tp-pri), var(--tp-pri2)); color: #fff; }
.tp-cf-who { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 10px auto 6px; max-width: 900px; }
.tp-cf-who .none { color: var(--tp-muted); font-size: 14px; }
.tp-cf-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid rgba(250, 204, 21, 0.4); border-radius: 16px; background: rgba(250, 204, 21, 0.12); color: #fef3c7; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
.tp-cf-chip small { font-size: 11px; font-weight: 500; color: var(--tp-muted); }
.tp-cf-chip.off { opacity: 0.4; text-decoration: line-through; }
.tp-cf-add { display: flex; justify-content: center; gap: 8px; margin: 8px auto; max-width: 420px; }
.tp-cf-add input { flex: 1; min-width: 0; height: 42px; padding: 0 12px; border: 1px solid var(--tp-line); border-radius: 12px; background: rgba(0, 0, 0, 0.25); color: #fff; font: inherit; font-size: 16px; }
.tp-cf-how { display: flex; justify-content: center; gap: 8px; margin: 12px auto; }
.tp-cf-how button { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; border: 1px solid var(--tp-line); border-radius: 12px; background: rgba(255, 255, 255, 0.06); color: var(--tp-text); font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.tp-cf-how button.on { border-color: transparent; background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff; }
.tp-cf-how.locked button:not(.on) { opacity: 0.35; pointer-events: none; }
.tp-cf-how.sm { margin: 0 0 0 auto; gap: 4px; }
.tp-cf-how.sm button { height: 32px; padding: 0 10px; font-size: 13px; }
.tp-cf-how .tp-ic { width: 16px; height: 16px; }
.tp-cf-pres { display: flex; justify-content: center; gap: 8px; margin: 10px 0; }
.tp-cf-pinfo { display: flex; align-items: center; gap: 6px; margin: 10px 0; color: var(--tp-muted); font-size: 13px; }
.tp-cf-pinfo .tp-ic { width: 16px; height: 16px; }
.tp-ld { display: flex; justify-content: center; margin: 8px auto 12px; padding: 12px; border-radius: 20px; background: rgba(0, 0, 0, 0.2); overflow-x: auto; }
.tp-ld canvas { display: block; height: auto; }
/* 진행자 방 준비 (11-24) — 넓으면 왼쪽 방 코드 · 라운드 · [이 방으로 시작] / 오른쪽 QR, 좁으면 위아래 + 시작 단추가 아래에 붙음 */
.tp.host .tp-setup.tp-hs { max-width: 980px; }
.tp-hs-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.tp-hs-main .tp-bigcode { margin: 6px 0 10px; }
.tp-bigcode.dim { opacity: 0.35; }
.tp-hs-round { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 4px 0 14px; color: var(--tp-muted); font-size: 14px; }
.tp-hs-go { margin: 10px 0 6px; }
.tp-hs-side .tp-mobile { margin-top: 0; }
.tp-hs-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; margin: 6px 0; }
.tp-linkbtn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 4px; border: 0; background: none; color: var(--tp-muted); font: inherit; font-size: 14px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.tp-linkbtn:hover { color: #fff; }
.tp-linkbtn .tp-ic { width: 14px; height: 14px; }
.tp-qr-cap { margin-left: auto; color: var(--tp-muted); font-size: 12px; font-weight: 400; }
.tp-mob-edit { margin-top: 8px; color: var(--tp-muted); font-size: 13px; }
.tp-mob-edit summary { cursor: pointer; }
/* [이 방으로 시작] — 눌러 보고 싶게 숨 쉬는 빛 */
.tp-go-glow { position: relative; animation: tp-go-breathe 2.2s ease-in-out infinite; }
@keyframes tp-go-breathe { 0%, 100% { box-shadow: 0 6px 18px rgba(91, 124, 250, 0.35), 0 0 0 0 rgba(140, 160, 255, 0.55); } 50% { box-shadow: 0 8px 26px rgba(91, 124, 250, 0.55), 0 0 0 10px rgba(140, 160, 255, 0); } }
.tp-go-glow.tp-go-hint { animation: tp-go-shake 0.5s ease-in-out 3, tp-go-breathe 2.2s ease-in-out infinite; }
@keyframes tp-go-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px) rotate(-1deg); } 75% { transform: translateX(5px) rotate(1deg); } }
.tp-nudge { position: fixed; z-index: 120; display: flex; align-items: center; gap: 8px; max-width: 320px; padding: 10px 14px; border-radius: 14px; background: #fff; color: #1a1f3d; font-size: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); animation: tp-pop 0.3s ease-out; pointer-events: none; }
.tp-nudge::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -8px; border: 8px solid transparent; border-bottom: 0; border-top-color: #fff; }
.tp-nudge.below::after { top: -8px; bottom: auto; border-top: 0; border-bottom: 8px solid #fff; }
.tp-nudge .tp-ic { width: 18px; height: 18px; color: #5b7cfa; }
.tp-nudge.out { opacity: 0; transition: opacity 0.4s; }
@media (prefers-reduced-motion: reduce) { .tp-go-glow, .tp-go-glow.tp-go-hint { animation: none; } }
@media (max-width: 720px) {
  /* 방 코드 → 라운드 → 링크 → QR → [이 방으로 시작](아래에 붙음) — QR 을 보다가 바로 누름 */
  .tp-hs-grid { display: flex; flex-direction: column; gap: 0; }
  .tp-hs-main { display: contents; }
  .tp-hs-main .tp-bigcode { order: 1; }
  .tp-hs-round { order: 2; }
  .tp-hs-links { order: 3; }
  #tpOtherBox { order: 4; }
  .tp-hs-grid .tp-hs-side { order: 5; margin-top: 8px; }
  .tp-hs-grid .tp-hs-go { order: 6; position: sticky; bottom: 10px; z-index: 5; margin-top: 14px; }
}
.tp-mobile h3 { display: flex; align-items: center; gap: 6px; margin: 0 0 10px; font-size: 16px; }
.tp-qr { width: 200px; height: 200px; margin: 0 auto; padding: 8px; border-radius: 12px; background: #fff; }
.tp-qr svg { width: 100%; height: 100%; display: block; }
.tp-url { margin: 8px 0; text-align: center; font-size: 12px; color: var(--tp-muted); word-break: break-all; }
/* 공용 판 */
.tp-board { position: relative; padding: 22px; border-radius: 20px; background: linear-gradient(135deg, #20275a, #2c1d55); border: 1px solid var(--tp-line); text-align: center; overflow: hidden; }
.tp-board.sm { padding: 16px; }
.tp-qn { display: inline-block; margin-bottom: 8px; padding: 2px 10px; border-radius: 10px; background: rgba(255, 255, 255, 0.12); font-size: 12px; color: #c7d2fe; }
.tp-q { min-height: 1.3em; max-height: 4.2em; font-size: 26px; font-weight: 800; line-height: 1.35; overflow: hidden; }
.tp.host .tp-board .tp-q { font-size: 56px; max-height: 3.4em; }
.tp-veil { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: repeating-linear-gradient(135deg, #1b1f45 0 14px, #20254f 14px 28px); font-size: 15px; color: var(--tp-muted); }
.tp-veil b { font-size: 28px; color: #fff; letter-spacing: 6px; }
.tp-veil .tp-ic { width: 40px; height: 40px; color: #ffd43b; }
.tp-veil[hidden] { display: none; }
/* 1. 컬러 */
.tp-swatch { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 46vh; min-height: 240px; padding: 18px; border-radius: 22px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.15); margin-bottom: 14px; }
.tp-swatch b { font-size: 30px; }
.tp-swatch span { font-size: 15px; opacity: 0.85; }
.tp-swatch.big { height: 60vh; flex: 1; }
.tp-swatch.big b { font-size: 56px; }
.tp-split { display: flex; gap: 22px; align-items: stretch; }
.tp-timerbox { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-width: 320px; }
.tp-ringwrap { position: relative; width: 240px; height: 240px; }
.tp-ringwrap b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 84px; font-weight: 900; }
.tp-ring { width: 100%; height: 100%; transform: rotate(-90deg); }
.tp-ring circle { fill: none; stroke-width: 10; }
.tp-ring .bg { stroke: rgba(255, 255, 255, 0.1); }
.tp-ring .fg { stroke: #ffd43b; stroke-linecap: round; transition: stroke-dashoffset 0.3s linear; }
.urgent .tp-ring .fg { stroke: var(--tp-bad); }
.urgent .tp-ringwrap { animation: tp-pulse 0.5s ease-in-out infinite; }
@keyframes tp-pulse { 50% { transform: scale(1.06); } }
.tp-fullcolor { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center; padding: 30px; font-size: 14px; }
.tp-fullcolor span { padding: 6px 14px; border-radius: 14px; background: rgba(0, 0, 0, 0.18); }
/* 2. 타이머 */
.tp-target { display: flex; flex-direction: column; align-items: center; margin: 6px 0 14px; }
.tp-target span { color: var(--tp-muted); font-size: 14px; }
.tp-target b { font-size: 64px; font-weight: 900; font-variant-numeric: tabular-nums; background: linear-gradient(135deg, #ffd43b, #ff922b); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tp-target b small { font-size: 24px; }
.tp-target.sm b { font-size: 34px; }
.tp.host .tp-target b { font-size: 120px; }
.tp-watch { margin: 16px auto 4px; text-align: center; font-size: 22vw; max-font-size: 120px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -2px; }
@media (min-width: 560px) { .tp-watch { font-size: 120px; } }
.tp-watch.blind { color: #c084fc; animation: tp-blink 1s steps(2) infinite; }
.tp-watch.shown { color: #ffd43b; animation: tp-pop 0.4s ease-out; }
@keyframes tp-blink { 50% { opacity: 0.55; } }
@keyframes tp-pop { 0% { transform: scale(0.6); } 70% { transform: scale(1.1); } 100% { transform: none; } }
.tp-runners { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 12px 0; }
.tp-runner { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 14px; background: var(--tp-panel); border: 1px solid var(--tp-line); color: var(--tp-muted); font-size: 14px; }
.tp-runner input { height: 56px; border: 0; border-radius: 10px; background: rgba(0, 0, 0, 0.3); color: #fff; font-size: 32px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
.tp-runner em { font-style: normal; text-align: right; }
.tp-result { min-height: 120px; }
.tp-drum { text-align: center; font-size: 34px; font-weight: 800; animation: tp-blink 0.3s steps(2) infinite; }
.tp-sum { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 30px; padding: 18px; border-radius: 18px; background: var(--tp-panel); animation: tp-pop 0.4s ease-out; }
.tp-sum div { display: flex; flex-direction: column; align-items: center; }
.tp-sum span { color: var(--tp-muted); }
.tp-sum b { font-size: 48px; font-variant-numeric: tabular-nums; }
.tp-sum strong { font-size: 36px; }
.tp-sum.g-top strong { color: #ffd43b; } .tp-sum.g-good strong { color: #4ade80; } .tp-sum.g-mid strong { color: #93c5fd; } .tp-sum.g-low strong { color: #fca5a5; }
/* 3. 텔레파시 */
.tp-answer { position: relative; margin: 14px 0; }
.tp-answer textarea { width: 100%; padding: 14px; border: 1px solid var(--tp-line); border-radius: 14px; background: rgba(0, 0, 0, 0.3); color: #fff; font-size: 26px; font-weight: 700; resize: none; }
.tp-cover { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 14px; background: repeating-linear-gradient(135deg, #2a2f6b 0 12px, #313777 12px 24px); cursor: pointer; }

.tp-bb-q { color: #8f96c9; font-size: 14px; }
.tp-bb-a { width: 100%; height: 60vh; display: flex; align-items: center; justify-content: center; font-weight: 900; line-height: 1.15; word-break: keep-all; overflow: hidden; text-shadow: 0 0 18px rgba(255, 230, 109, 0.75); animation: tp-pop 0.4s ease-out; }

.tp-callout { position: fixed; inset: 0; z-index: 110; display: flex; align-items: center; justify-content: center; font-size: 22vw; font-weight: 900; color: #fff; background: rgba(15, 18, 38, 0.7); pointer-events: none; text-shadow: 0 10px 40px rgba(91, 124, 250, 0.8); }
.tp-callout.pop { animation: tp-pop 0.5s ease-out; }
/* 4. 그림 */
.tp-drawhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.tp-role { font-weight: 800; font-size: 17px; }
.tp-word { margin: 6px 0; padding: 10px 14px; border-radius: 12px; background: #fff; color: #111; font-size: 26px; font-weight: 900; text-align: center; }
.tp-word.hide { background: rgba(255, 255, 255, 0.1); color: var(--tp-muted); letter-spacing: 6px; }
.tp-canvaswrap { position: relative; width: 100%; aspect-ratio: 4 / 3; max-height: 56vh; margin: 10px 0; border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4); }
.tp-canvaswrap canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.tp-cvlock { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 16px; background: rgba(15, 18, 38, 0.86); text-align: center; }

.tp-cvlock span { color: var(--tp-muted); font-size: 13px; }
.tp-cvlock[hidden] { display: none; }
.tp-cvtimer { position: absolute; top: 10px; right: 10px; min-width: 56px; height: 56px; padding: 0 10px; border-radius: 28px; display: flex; align-items: center; justify-content: center; background: rgba(15, 18, 38, 0.85); color: #fff; font-size: 30px; font-weight: 900; }
.tp-cvtimer.hot { background: var(--tp-bad); animation: tp-pulse 0.5s infinite; }
.tp-cvtimer[hidden] { display: none; }
.tp-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tp-sw { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.4); cursor: pointer; }
.tp-sw.on { outline: 3px solid #ffd43b; outline-offset: 2px; }
.tp-secret { filter: none; }
/* 5. 암호 */
.tp-roles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0; }
.tp-rolebtn { height: 96px; border: 0; border-radius: 18px; background: linear-gradient(135deg, #2a2f6b, #3b1d5e); color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.tp-rolebtn b { font-size: 40px; line-height: 1; }
.tp-lead { font-size: 17px; font-weight: 700; }
.tp-clue { position: relative; padding: 18px; border-radius: 18px; background: #fffbea; color: #1f2937; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35); }
.tp-clue-k { display: inline-block; padding: 2px 10px; border-radius: 10px; background: #fde68a; color: #92400e; font-size: 12px; font-weight: 800; }
.tp-clue p { margin: 10px 0 4px; font-size: 24px; font-weight: 800; line-height: 1.4; word-break: keep-all; }
.tp-clue .tp-btn { position: absolute; top: 10px; right: 10px; color: #92400e; border: 0; }
.tp-slots { display: flex; justify-content: center; gap: 10px; margin: 18px 0 10px; }
.tp-slots span { width: 58px; height: 70px; display: flex; align-items: center; justify-content: center; border-radius: 14px; border: 2px solid var(--tp-line); background: rgba(0, 0, 0, 0.3); font-size: 38px; font-weight: 900; }
.tp-slots span.on { border-color: var(--tp-pri); }
.tp-slots.ok span { border-color: var(--tp-good); color: #4ade80; }
.tp-slots.shake { animation: tp-shake 0.4s; }
@keyframes tp-shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
.tp-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 360px; margin: 0 auto; }
.tp-pad button { height: 60px; border: 0; border-radius: 14px; background: rgba(255, 255, 255, 0.09); color: #fff; font-size: 26px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.tp-pad button:active { background: rgba(91, 124, 250, 0.45); }
.tp-pad button.ok { background: linear-gradient(135deg, var(--tp-pri), var(--tp-pri2)); font-size: 18px; }
.tp-unlocked { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 14px 0; color: #4ade80; animation: tp-pop 0.5s ease-out; }
.tp-unlocked .tp-ic { width: 72px; height: 72px; }
.tp-unlocked b { font-size: 30px; }
.tp-lockbig { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 24px; border-radius: 22px; background: linear-gradient(135deg, #20275a, #2c1d55); overflow: hidden; }
.tp-lockbig > .tp-ic { width: 90px; height: 90px; color: #ffd43b; }
.tp-lockbig.open > .tp-ic { color: #4ade80; }
.tp-code { font-size: 110px; font-weight: 900; letter-spacing: 10px; font-variant-numeric: tabular-nums; }
.tp-hints { display: flex; flex-direction: column; gap: 8px; max-width: 900px; margin: 10px auto; }
.tp-hint { padding: 12px 16px; border-radius: 14px; background: rgba(255, 212, 59, 0.12); border: 1px solid rgba(255, 212, 59, 0.35); font-size: 22px; animation: tp-pop 0.35s ease-out; }
.tp-hint b { margin-right: 10px; color: #ffd43b; }
.tp-allclues { max-width: 900px; margin: 10px auto; padding-left: 28px; font-size: 22px; line-height: 1.6; }
.tp-allclues[hidden] { display: none; }
/* 알림 · 폭죽 */
.tp-toast { position: fixed; left: 50%; bottom: 96px; z-index: 120; transform: translateX(-50%); max-width: 88vw; padding: 10px 18px; border-radius: 14px; background: rgba(0, 0, 0, 0.85); color: #fff; font-size: 14px; text-align: center; transition: opacity 0.4s; }
.tp-toast.win { background: linear-gradient(135deg, #f59e0b, #ec4899); font-size: 18px; font-weight: 800; }
.tp-toast.bad { background: #7f1d1d; }
.tp-toast.out { opacity: 0; }
.tp-confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 130; pointer-events: none; }
/* 좁은 화면 */
@media (max-width: 520px) {
  .tp-brand b { display: none; }
  .tp-mode button span { display: none; }
  .tp-split { flex-direction: column; }
  .tp-timerbox { min-width: 0; }
  .tp-code { font-size: 64px; }
  .tp-bigcode { font-size: 60px; letter-spacing: 10px; }
}
/* 티키타카 안에 끼워 쓸 때 */
.tp.embed { min-height: 100vh; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ── 카메라 색 채점 (11-22) ── */
.tp-cam { position: fixed; inset: 0; z-index: 140; background: #000; display: flex; flex-direction: column; }
.tp-cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tp-reticle { position: absolute; left: 50%; top: 42%; width: 34vmin; height: 34vmin; transform: translate(-50%, -50%); border-radius: 50%; border: 4px solid #fff; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35), 0 0 18px rgba(255, 255, 255, 0.6); transition: border-color 0.2s; }
.tp-reticle i { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid #fff; }
.tp-reticle.g-top { border-color: #ffd43b; } .tp-reticle.g-good { border-color: #4ade80; } .tp-reticle.g-mid { border-color: #93c5fd; } .tp-reticle.g-low { border-color: #fca5a5; }
.tp-cambar { position: absolute; left: 12px; right: 12px; bottom: calc(110px + env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px; border-radius: 18px; background: rgba(15, 18, 38, 0.82); backdrop-filter: blur(6px); }
.tp-cmp { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 76px; font-size: 11px; color: var(--tp-muted); text-align: center; }
.tp-cmp i { width: 52px; height: 52px; border-radius: 14px; border: 2px solid rgba(255, 255, 255, 0.5); background: #333; }
.tp-live { display: flex; flex-direction: column; align-items: center; }
.tp-live b { font-size: 56px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.tp-live small { font-size: 14px; }
.tp-live span { margin-top: 2px; font-size: 13px; color: var(--tp-muted); }
.tp-live.g-top b { color: #ffd43b; } .tp-live.g-good b { color: #4ade80; } .tp-live.g-mid b { color: #93c5fd; } .tp-live.g-low b { color: #fca5a5; }
.tp-camacts { position: absolute; left: 12px; right: 12px; bottom: calc(20px + env(safe-area-inset-bottom)); display: flex; gap: 10px; }
.tp-camacts .tp-btn.xl { flex: 1; }
.tp-shutter { position: absolute; inset: 0; background: #fff; animation: tp-shut 0.22s ease-out forwards; }
@keyframes tp-shut { from { opacity: 0.9; } to { opacity: 0; } }
.tp-scorecard { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 0 0 14px; padding: 16px; border-radius: 20px; background: var(--tp-panel); border: 1px solid var(--tp-line); animation: tp-pop 0.4s ease-out; }
.tp-sc-pics { display: flex; align-items: center; gap: 12px; }
.tp-sc-pics img, .tp-sc-pics i { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255, 255, 255, 0.6); display: block; }
.tp-sc-num b { font-size: 72px; font-weight: 900; line-height: 1; }
.tp-sc-num small { font-size: 20px; }
.tp-scorecard strong { font-size: 24px; }
.tp-scorecard.g-top { border-color: #ffd43b; } .tp-scorecard.g-top strong, .tp-scorecard.g-top .tp-sc-num { color: #ffd43b; }
.tp-scorecard.g-good strong, .tp-scorecard.g-good .tp-sc-num { color: #4ade80; }
.tp-scorecard.g-mid strong, .tp-scorecard.g-mid .tp-sc-num { color: #93c5fd; }
.tp-scorecard.g-low strong, .tp-scorecard.g-low .tp-sc-num { color: #fca5a5; }
label.tp-btn { position: relative; }
.tp-sb { margin-top: 18px; padding: 16px; border-radius: 18px; background: var(--tp-panel); border: 1px solid var(--tp-line); }
.tp-sb-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; }
.tp-sb-head b { display: inline-flex; align-items: center; gap: 6px; font-size: 20px; }
.tp-sb-add { display: flex; flex-wrap: wrap; gap: 8px; }
.tp-sb-add input { height: 44px; padding: 0 12px; border: 1px solid var(--tp-line); border-radius: 10px; background: rgba(0, 0, 0, 0.3); color: #fff; font-size: 18px; }
#tpSbName { width: 160px; } #tpSbScore { width: 90px; text-align: center; }
.tp-sb-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.tp-sb-list li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.06); font-size: 20px; animation: tp-pop 0.3s ease-out; }
.tp-sb-list li b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tp-sb-list li em { font-style: normal; font-weight: 900; color: #ffd43b; }
.tp-sb-rk { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.12); font-size: 14px; font-weight: 800; }
.tp-sb-list li.m1 .tp-sb-rk { background: #f59e0b; color: #fff; } .tp-sb-list li.m2 .tp-sb-rk { background: #94a3b8; color: #fff; } .tp-sb-list li.m3 .tp-sb-rk { background: #b45309; color: #fff; }
.tp-sb-x { border: 0; background: none; color: var(--tp-muted); cursor: pointer; }

/* 점수 중계 (11-22) */
.tp-send { display: flex; gap: 8px; width: 100%; margin-top: 8px; }
.tp-send input { flex: 1; min-width: 0; height: 44px; padding: 0 12px; border: 1px solid var(--tp-line); border-radius: 10px; background: rgba(0, 0, 0, 0.3); color: #fff; font-size: 16px; }
.tp-sb-auto-st { margin-left: auto; padding: 3px 10px; border-radius: 12px; font-size: 13px; background: rgba(255, 255, 255, 0.08); color: var(--tp-muted); }
.tp-sb-auto-st.on { background: rgba(34, 197, 94, 0.18); color: #86efac; }
.tp-sb-auto-st.off { background: rgba(245, 158, 11, 0.15); color: #fcd34d; }
.tp-sb-auto { color: #86efac; display: inline-flex; }
.tp-sb-list li.new { animation: tp-pop 0.5s ease-out; box-shadow: 0 0 0 2px #86efac inset; }

/* 릴레이 타이머 기록 중계 (11-22) */
.tp-rn-who { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; font-size: 12px; font-weight: 600; color: #86efac; }

.tp-runner input.auto { box-shadow: 0 0 0 2px rgba(134, 239, 172, 0.6) inset; }
.tp-runner.new { animation: tp-pop 0.5s ease-out; }
#tpTmSend { width: 100%; max-width: 420px; margin: 10px auto 0; }

/* 텔레파시 같은 답 순위 (11-22) */
.tp-gbody .tp-tl { width: 100%; max-width: 900px; margin: 14px auto 0; padding: 14px 16px; border-radius: 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--tp-line); }
.tp-tl-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin-bottom: 10px; }
.tp-tl-head b { font-size: 20px; }
.tp-tl-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.tp-tl-list li { display: grid; grid-template-columns: 40px 1fr auto; grid-template-areas: 'rk a n' 'rk w w'; align-items: center; gap: 2px 12px; padding: 10px 14px; border-radius: 12px; background: rgba(0, 0, 0, 0.25); cursor: pointer; animation: tp-pop 0.45s ease-out; }
.tp-tl-list li .tp-sb-rk { grid-area: rk; }
.tp-tl-list li b { grid-area: a; font-size: 26px; overflow-wrap: anywhere; }
.tp-tl-list li em { grid-area: n; font-style: normal; font-size: 22px; font-weight: 800; color: #fcd34d; }
.tp-tl-list li small { grid-area: w; color: var(--tp-muted); font-size: 13px; }
.tp-tl-list li.m1 { background: linear-gradient(90deg, rgba(250, 204, 21, 0.25), rgba(0, 0, 0, 0.25)); box-shadow: 0 0 0 2px rgba(250, 204, 21, 0.55) inset; }
.tp-tl-list li.m1 b { font-size: 34px; }
.tp-tl-list li.pick { box-shadow: 0 0 0 3px #60a5fa inset; }

/* 큰 축하 — 티키타카 온라인 파티룸(.tk-cel)과 같은 모양 (11-22) */
.tp-cel { position: fixed; inset: 0; z-index: 125; display: flex; align-items: center; justify-content: center; background: rgba(2, 6, 23, 0.74); cursor: pointer; overflow: hidden; animation: tp-cel-in 0.25s; }
.tp-cel.bye { opacity: 0; transition: opacity 0.35s; }
.tp-cel-rays { position: absolute; left: 50%; top: 50%; width: 220vmax; height: 220vmax; margin: -110vmax 0 0 -110vmax; background: repeating-conic-gradient(from 0deg, rgba(255, 214, 102, 0.22) 0deg 10deg, transparent 10deg 20deg); opacity: 0; transform: scale(0.6); transition: opacity 0.5s, transform 0.8s; animation: tp-cel-spin 14s linear infinite; }
.tp-cel.hit .tp-cel-rays { opacity: 1; transform: scale(1); }
.tp-cel-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.tp-cel.hit .tp-cel-flash { animation: tp-cel-flash 0.5s ease-out; }
.tp-cel-card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; color: #fff; text-align: center; padding: 0 20px; }
.tp-cel-roll { font-size: clamp(24px, 4vw, 40px); font-weight: 800; letter-spacing: 1px; animation: tp-pulse 0.5s infinite; }
.tp-cel.hit .tp-cel-roll { display: none; }
.tp-cel-main { display: none; flex-direction: column; align-items: center; gap: 14px; }
.tp-cel.hit .tp-cel-main { display: flex; animation: tp-cel-zoom 0.6s cubic-bezier(.2, 1.6, .4, 1); }
.tp-cel-crown { width: clamp(80px, 10vw, 130px); animation: tp-cel-drop 0.7s 0.15s cubic-bezier(.3, 1.5, .5, 1) both; }
.tp-cel-crown svg { width: 100%; display: block; filter: drop-shadow(0 6px 18px rgba(252, 196, 25, 0.7)); }
.tp-cel-faces { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; }
.tp-cel-face { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.tp-cel-face i { display: flex; align-items: center; justify-content: center; width: clamp(92px, 11vw, 150px); height: clamp(92px, 11vw, 150px); border-radius: 50%; font-style: normal; font-weight: 900; font-size: clamp(40px, 5vw, 64px); color: #fff; border: 6px solid #fcc419; box-shadow: 0 0 0 6px rgba(252, 196, 25, 0.25), 0 0 60px rgba(252, 196, 25, 0.6); animation: tp-cel-glow 1.4s ease-in-out infinite; }
.tp-cel-face b { font-size: clamp(16px, 2vw, 24px); }
.tp-cel-title { font-size: clamp(34px, 6vw, 76px); font-weight: 900; letter-spacing: 1px; line-height: 1.15; word-break: keep-all; background: linear-gradient(90deg, #fff 0%, #ffe066 40%, #fff 60%, #ffe066 100%); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: tp-cel-shine 1.6s linear infinite; }
.tp-cel-sub { font-size: clamp(15px, 2vw, 24px); opacity: 0.9; word-break: keep-all; }
.tp-cel-tap { font-size: 12px; opacity: 0.5; margin-top: 8px; }
body.tp-shake { animation: tp-cel-shake 0.5s; }
.tp-miss { position: fixed; inset: 0; z-index: 125; pointer-events: none; display: flex; align-items: center; justify-content: center; }
.tp-miss span { padding: 10px 28px; border: 6px solid #ff6b6b; border-radius: 16px; color: #ff6b6b; background: rgba(15, 23, 42, 0.7); font-size: clamp(36px, 7vw, 88px); font-weight: 900; word-break: keep-all; text-align: center; max-width: 86vw; text-shadow: 0 0 24px rgba(255, 107, 107, 0.6); animation: tp-miss-stamp 1.7s ease-out both; }
@keyframes tp-cel-in { from { opacity: 0; } }
@keyframes tp-cel-spin { to { transform: rotate(360deg); } }
@keyframes tp-cel-flash { 0% { opacity: 0.85; } 100% { opacity: 0; } }
@keyframes tp-cel-zoom { 0% { transform: scale(0.3); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes tp-cel-drop { 0% { transform: translateY(-120px) rotate(-20deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes tp-cel-glow { 50% { box-shadow: 0 0 0 10px rgba(252, 196, 25, 0.35), 0 0 90px rgba(252, 196, 25, 0.85); } }
@keyframes tp-cel-shine { to { background-position: -200% center; } }
@keyframes tp-cel-shake { 15%, 55% { transform: translate(-8px, 4px); } 35%, 75% { transform: translate(8px, -4px); } }
@keyframes tp-miss-stamp { 0% { transform: rotate(-12deg) scale(2.6); opacity: 0; } 18% { transform: rotate(-12deg) scale(0.92); opacity: 1; } 26% { transform: rotate(-12deg) scale(1); } 80% { opacity: 1; } 100% { transform: rotate(-12deg) scale(1); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .tp-cel-rays, .tp-cel-roll, .tp-cel-face i, .tp-cel-title, body.tp-shake { animation: none !important; } }

/* 11-22 — 숨김은 언제나 숨김(.tp-row 의 display 가 hidden 을 덮던 것: 텔레파시 [모두 같아요] · 그림 [맞혔다] 가 공개 전에 보임) · 축하 흔들림 때 스크롤 막대 안 뜨게 */
[hidden] { display: none !important; }
html:has(body.tp-shake) { overflow: hidden; }

/* ══ 게임 6. 점심 메뉴 고르기 (11-23) ══ */
.tp-lu-q1 { font-size: clamp(22px, 3.4vw, 40px); }
.tp-lu-meta { margin-top: 10px; color: var(--tp-muted); font-size: 15px; }
.tp-lu-meta b { color: #fcd34d; font-size: 18px; }
.tp-lu-who { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 10px auto 4px; max-width: 900px; }

            function (x) { return x[i] > x[j]; });

            function (x) { return x[i] + x[j] === s; });

            function (x) { return cnt(x, n) > 0; });

    else mk(F, 'dist', 'repeat', 1, '', '같은 숫자가 두 번 이상 나온다', '같은 숫자가 두 번 이상 나오며', function (x) { return !isDistinct(x); });

    if (d[0] < d[1] && d[1] < d[2] && d[2] < d[3]) mk(F, 'ord', 'ascending', 1, '', '네 숫자는 왼쪽부터 점점 커진다', '네 숫자는 왼쪽부터 점점 커지며',
      function (x) { return x[0] < x[1] && x[1] < x[2] && x[2] < x[3]; });
    if (d[0] > d[1] && d[1] > d[2] && d[2] > d[3]) mk(F, 'ord', 'descending', 1, '', '네 숫자는 왼쪽부터 점점 작아진다', '네 숫자는 왼쪽부터 점점 작아지며',

  // ---------- 난이도 ----------
  var LEVELS = {

  function pickFact(rng, facts, wsum, lv) {

      text: first + ' ' + second,

  function filterIdx(S, fn) {

  }

  }

  // 한 코드에 대해 단서 4개를 맞춰 본다. 실패하면 null
  function tryBuild(rng, codeIdx, facts, wsum, lv) {
    var S = [];
    for (var i = 0; i < 10000; i++) S.push(i);
    var chosen = [], used = {};
    var limits = [6000, 1500, 60];   // 단서 1 · 2 · 3개 뒤 남을 후보 상한

        ns = filterIdx(S, c.fn);
        if (ns.length >= S.length * 0.8) continue;      // 거의 안 좁혀지면 버림

        got = c; break;
      }
      if (!got) return null;
      chosen.push(got);
      for (var g = 0; g < got.ids.length; g++) used[got.ids[g]] = true;
      S = ns;
    }
    // 넷째 단서: 남은 후보 가운데 코드만 남기는 것
    var last = null;
    for (t = 0; t < 120; t++) {
      c = makeClue(rng, facts, wsum, lv);
      if (overlap(c, used)) continue;
      ns = filterIdx(S, c.fn);
      if (ns.length === 1 && ns[0] === codeIdx) { last = c; break; }
    }

    chosen.push(last);

    for (i = 0; i < 4; i++) {

    }
    for (i = 0; i < 4; i++) {
      var rest = [];
      for (var k = 0; k < 4; k++) if (k !== i) rest.push(masks[k]);
      if (maskCount(rest) < 2) return null;                          // (c)
    }

  }

  function makeFull(seedStr, opts) {
    opts = opts || {};
    var level = LEVELS[opts.level] ? opts.level : 'normal';
    var lv = LEVELS[level];
    // 기본(normal)은 시드 글자열 그대로, easy · hard 는 뒤에 '#난이도' 를 붙여 다른 퍼즐이 나오게 한다

    for (var round = 0; round < 1000; round++) {
      // 코드 뽑기: 0 을 쓸지 · 숫자가 겹칠지 시드에 따라
      var allowZero = rng() < 0.5;

      var d = [], pool = [];
      var lo = allowZero ? 0 : 1, n;
      for (n = lo; n <= 9; n++) pool.push(n);
      if (allowRepeat) {

      } else {
        shuffle(rng, pool);
        d = pool.slice(0, 4);
      }
      var codeIdx = d[0] * 1000 + d[1] * 100 + d[2] * 10 + d[3];
      var facts = buildFacts(d, rng);
      var wsum = 0, f;
      var usable = [];
      for (f = 0; f < facts.length; f++) if (lv.w[facts[f].tier] > 0) { usable.push(facts[f]); wsum += lv.w[facts[f].tier]; }

      for (var att = 0; att < 25; att++) {

    }

  }

  function finish(rng, d, r, level, rounds) {

    var clues = [], masks = [];
    for (var i = 0; i < 4; i++) { clues.push(r.clues[order[i]]); masks.push(r.masks[order[i]]); }
    var code = '' + d[0] + d[1] + d[2] + d[3];

    // 힌트 1: 함께 보면 가장 많이 좁혀지는 두 단서
    var best = null, bi = 0, bj = 1;

    var hints = [
      (bi + 1) + '번과 ' + (bj + 1) + '번 단서를 먼저 함께 보세요',
      P[p] + ' 자리는 ' + d[p] + ' 입니다',
      p < 2 ? '앞 두 자리는 ' + d[0] + d[1] + ' 입니다' : '뒤 두 자리는 ' + d[2] + d[3] + ' 입니다'
    ];

    var solve = [
      '1번 단서만 → 후보 ' + maskCount([masks[0]]) + '개',
      '1~2번 → 후보 ' + maskCount([masks[0], masks[1]]) + '개',
      '1~3번 → 후보 ' + maskCount([masks[0], masks[1], masks[2]]) + '개',
      '1~4번 → ' + code + ' 하나'
    ];
    var minDrop = 10000;
    for (i = 0; i < 4; i++) {
      var rest = [];
      for (var k = 0; k < 4; k++) if (k !== i) rest.push(masks[k]);
      var mc = maskCount(rest);
      if (mc < minDrop) minDrop = mc;
    }
    solve.push('한 사람이라도 빠지면 → 후보 ' + minDrop + '개 이상');

    var texts = [], objs = [];

      var now = Date.now(); pts.push([now, e.clientX, e.clientY]);

      if (shown || pts.length < 8) return;
      var dist = 0, x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
      for (var i = 1; i < pts.length; i++) dist += Math.hypot(pts[i][1] - pts[i - 1][1], pts[i][2] - pts[i - 1][2]);
      pts.forEach(function (p) { x0 = Math.min(x0, p[1]); x1 = Math.max(x1, p[1]); y0 = Math.min(y0, p[2]); y1 = Math.max(y1, p[2]); });

  function cfHost(body) {
